# A workflow is a YAML file in .github/workflows/. GitHub reads every file there and runs it when its trigger happens.
name: CI

# "on" says what starts the workflow.
on:
  # Every push to main, so a bad commit there is noticed straight away.
  push:
    branches: [main]
  # Every pull request, which runs the tests on the proposed merge before anyone clicks merge.
  pull_request:

# A workflow is made of jobs. Each job runs on its own fresh virtual machine (a "runner"), and jobs run in parallel
# unless you say otherwise.
jobs:
  test:
    # A matrix runs this whole job once for every combination of the values below, each on its own runner, in parallel.
    # "os" is a name chosen here; the entries under it are the values. The generated package has files that only compile
    # on one OS (_win32, _macos, _metal), and the matrix test builds only for the OS it runs on, so each OS needs a runner.
    strategy:
      # By default one failing combination cancels the others. Turn that off so that a Windows failure does not hide
      # whether macOS is also broken.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # The machine image to use. ${{ matrix.os }} is replaced by the value for this combination. GitHub provides
    # ubuntu-latest, macos-latest and windows-latest.
    runs-on: ${{ matrix.os }}

    # A job is a list of steps, run in order on that machine. If any step fails, the job stops and is marked failed.
    steps:
      # "uses" runs a reusable action that someone else published. This one copies this repository onto the runner;
      # a new machine starts empty.
      - uses: actions/checkout@v4

      # Installs Go, and caches downloaded modules between runs so that later runs are faster.
      - uses: actions/setup-go@v5
        with:
          # Pinned so that a new Go release cannot change the results without a commit to this file. The tools below are
          # pinned for a stronger reason: the golden files in matrix/testdata/golden contain their output, so a different
          # goimports or stringer version could fail the golden comparison.
          go-version: "1.26"

      # "run" runs a shell command on the runner.
      - name: Install goimports and stringer
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install golang.org/x/tools/cmd/stringer@v0.51.0

      # GitHub sets CI=true on every runner. The matrix test fails, instead of skipping, when a tool is missing and
      # CI is set, so a broken tool install cannot make the matrix quietly pass.
      - name: Test
        run: go test -count=1 ./...

  # go-vk declares Go 1.18 as its minimum, and the test above generates the package with "go 1.18" in its go.mod. That
  # makes the compiler reject newer language features (builtin min and max, range over an integer, and so on) even on
  # Go 1.26, but it does not stop code from calling a standard library function added after 1.18, such as
  # strings.CutPrefix. Only a real 1.18 toolchain notices that, so this job compiles and tests the generated packages
  # with one.
  #
  # It does not need the OS matrix: the toolchain age matters, not the OS. The generator and stringer still run on
  # Go 1.26 (the test needs a recent Go, and stringer cannot run under 1.18); VK_MATRIX_GO_TOOLCHAIN switches only the
  # build, vet and test stages. Go 1.26 downloads the named toolchain on demand.
  go-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install goimports and stringer
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install golang.org/x/tools/cmd/stringer@v0.51.0
      - name: Build and test the generated packages with Go 1.18
        env:
          VK_MATRIX_GO_TOOLCHAIN: go1.18.10
        run: go test -count=1 -run TestRegistryMatrix ./matrix
