# A workflow is a YAML file in .github/workflows/. GitHub reads every file there and runs it when its trigger happens.
name: CI

# "on" says what starts the workflow.
on:
  # Every push to main, so a bad commit there is noticed straight away.
  push:
    branches: [main]
  # Every pull request, which runs the tests on the proposed merge before anyone clicks merge.
  pull_request:

# A workflow is made of jobs. Each job runs on its own fresh virtual machine (a "runner"), and jobs run in parallel
# unless you say otherwise.
jobs:
  test:
    # The machine image to use. GitHub provides ubuntu-latest, macos-latest and windows-latest.
    runs-on: ubuntu-latest

    # A job is a list of steps, run in order on that machine. If any step fails, the job stops and is marked failed.
    steps:
      # "uses" runs a reusable action that someone else published. This one copies this repository onto the runner;
      # a new machine starts empty.
      - uses: actions/checkout@v4

      # Installs Go, and caches downloaded modules between runs so that later runs are faster.
      - uses: actions/setup-go@v5
        with:
          # Pinned so that a new Go release cannot change the results without a commit to this file. The tools below are
          # pinned for a stronger reason: the golden files in matrix/testdata/golden contain their output, so a different
          # goimports or stringer version could fail the golden comparison.
          go-version: "1.26"

      # "run" runs a shell command on the runner.
      - name: Install goimports and stringer
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install golang.org/x/tools/cmd/stringer@v0.51.0

      # GitHub sets CI=true on every runner. The matrix test fails, instead of skipping, when a tool is missing and
      # CI is set, so a broken tool install cannot make the matrix quietly pass.
      - name: Test
        run: go test -count=1 ./...
